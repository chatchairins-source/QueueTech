<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>QueueTech Rider</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1420;
  --ink-soft:#1b2431;
  --line:rgba(255,255,255,.10);
  --paper:#f4f6f8;
  --paper-line:#e2e6ea;
  --on:#12B981;
  --on-soft:rgba(18,185,129,.16);
  --off:#64748b;
  --warn:#f5a524;
  --danger:#ef4444;
  --brand:#12B981;
  --brand-deep:#079669;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overscroll-behavior:none;}
body{
  font-family:'Prompt',system-ui,sans-serif;
  background:var(--ink);
  color:#101826;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
#app{position:fixed;inset:0;overflow:hidden;}

/* ---------- Screens without the map (login / pending) ---------- */
.screen-center{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:28px 20px calc(28px + var(--safe-bottom));
  background:radial-gradient(circle at 20% -10%, #0f3f35 0%, #071f1a 55%, #061914 100%);
}
.auth-card{width:100%;max-width:360px;color:#fff;}
.auth-mark{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.auth-mark .dot{width:11px;height:11px;border-radius:50%;background:var(--on);box-shadow:0 0 0 5px var(--on-soft);}
.auth-mark b{font-size:15px;letter-spacing:.2px;color:#dbe4f5;}
.auth-card h1{font-size:26px;line-height:1.28;margin:0 0 6px;font-weight:700;}
.auth-card p.sub{margin:0 0 26px;color:#9fb0c9;font-size:14px;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:#9fb0c9;margin-bottom:6px;}
.field input{
  width:100%;padding:13px 14px;border-radius:13px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none;
}
.field input::placeholder{color:#6d7c93;}
.field input:focus{border-color:var(--brand);background:rgba(18,185,129,.10);}
.btn{
  appearance:none;border:none;cursor:pointer;border-radius:14px;font-weight:700;
  font-size:15px;padding:15px 18px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;width:100%;margin-top:6px;box-shadow:0 10px 26px rgba(7,150,105,.35);}
.btn-brand:disabled{opacity:.55;box-shadow:none;}
.auth-err{margin-top:14px;font-size:13px;color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.28);padding:10px 12px;border-radius:10px;line-height:1.5;display:none;}
.auth-err.show{display:block;}
.auth-foot{margin-top:22px;text-align:center;font-size:12.5px;color:#5f6f88;}

.pending-card{width:100%;max-width:360px;text-align:center;color:#fff;}
.pending-icon{font-size:44px;margin-bottom:14px;}
.pending-card h1{font-size:21px;margin:0 0 8px;}
.pending-card p{color:#9fb0c9;font-size:14px;line-height:1.7;margin:0 0 22px;}
.pending-pill{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(245,165,36,.16);border:1px solid rgba(245,165,36,.4);color:#f5c778;font-size:13px;font-weight:600;margin-bottom:20px;}

/* ---------- Main driving screen ---------- */
.stage{position:fixed;inset:0;display:none;}
.stage.show{display:block;}
#map{position:absolute;inset:0;}

.topbar{
  position:absolute;top:0;left:0;right:0;z-index:500;
  padding:calc(14px + var(--safe-top)) 14px 34px;
  background:linear-gradient(180deg, rgba(10,15,24,.82) 0%, rgba(10,15,24,.35) 65%, transparent 100%);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;
}
.topbar > *{pointer-events:auto;}
.who{display:flex;flex-direction:column;gap:3px;color:#fff;}
.who .name{font-weight:700;font-size:15.5px;}
.who .plate{font-size:12px;color:#c6d1e3;}
.status-pill{
  display:flex;align-items:center;gap:8px;background:rgba(13,20,32,.72);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 8px 7px 14px;
  color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(6px);
}
.status-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--off);}
.status-pill.on .dot{background:var(--on);box-shadow:0 0 0 4px var(--on-soft);}
.status-switch{
  width:42px;height:24px;border-radius:14px;background:rgba(255,255,255,.16);position:relative;border:none;cursor:pointer;flex:0 0 auto;
}
.status-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cbd5e1;transition:transform .18s ease, background .18s ease;}
.status-switch.on{background:var(--on-soft);}
.status-switch.on::after{transform:translateX(18px);background:var(--on);}

.fab-stack{position:absolute;right:14px;top:calc(96px + var(--safe-top));z-index:500;display:flex;flex-direction:column;gap:10px;}
.fab{
  width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:0 8px 20px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#233045;
}
.fab:active{transform:scale(.94);}

.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:500;
  background:var(--paper);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 30px rgba(0,0,0,.22);
  padding:14px 16px calc(14px + var(--safe-bottom) + 78px);
  max-height:64vh;overflow-y:auto;
}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:#d3d9df;margin:0 auto 12px;}
.sheet-title{font-size:16px;font-weight:700;color:#101826;margin:0 0 4px;}
.sheet-sub{font-size:13px;color:#6b7686;margin:0 0 14px;line-height:1.5;}

.go-toggle{
  width:100%;padding:16px;border-radius:16px;border:none;cursor:pointer;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.go-toggle.off{background:var(--ink);color:#fff;}
.go-toggle.on{background:var(--on-soft);color:#166534;border:1.5px solid rgba(34,197,94,.45);}

.job-row{
  background:#fff;border:1px solid var(--paper-line);border-radius:16px;padding:13px;margin-bottom:10px;
  display:flex;flex-direction:column;gap:8px;
}
.job-row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.job-row .shop{font-weight:700;font-size:14.5px;color:#101826;}
.job-row .meta{font-size:12.5px;color:#6b7686;}
 .job-row .fee{font-weight:800;color:var(--brand-deep);font-size:15px;white-space:nowrap;}
.job-distances{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:2px;}
.job-distance{background:#f7f9fc;border:1px solid #e7ebf2;border-radius:10px;padding:8px 9px;font-size:12px;color:#5d6878;}
.job-distance b{display:block;color:#172033;font-size:13px;margin-top:2px;}
.job-distance.pickup{border-left:4px solid #16a34a;}
.job-distance.delivery{border-left:4px solid #dc2626;}
.job-row .accept{
  align-self:flex-end;background:var(--brand-deep);color:#fff;border:none;border-radius:11px;
  padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;
}
.empty-note{padding:26px 6px;text-align:center;color:#8492a6;font-size:13.5px;line-height:1.7;}

.job-card{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--paper-line);}
.job-card .oid{font-size:12px;color:#8492a6;margin-bottom:6px;}
.job-card .stage-label{
  display:inline-flex;align-items:center;gap:6px;background:rgba(18,185,129,.12);color:#079669;
  font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;margin-bottom:12px;
}
.stop{display:flex;gap:10px;margin-bottom:10px;}
.stop .mk{width:20px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:3px;}
.stop .mk i{width:9px;height:9px;border-radius:50%;background:var(--brand-deep);display:block;}
.stop .mk .ln{flex:1;width:2px;background:var(--paper-line);margin-top:4px;min-height:18px;}
.stop .tx{flex:1;}
.stop .tx b{display:block;font-size:14px;color:#101826;}
.stop .tx span{font-size:12.5px;color:#6b7686;}
.job-actions{display:flex;gap:8px;margin-top:6px;}
.job-actions a, .job-actions button{
  flex:1;border-radius:12px;border:1px solid var(--paper-line);background:#fff;color:#233045;
  padding:11px 8px;font-size:13px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;
}
.job-actions .chat-icon-btn{
  flex:0 0 46px;width:46px;min-width:46px;padding:0;font-size:20px;line-height:1;
}
.job-primary{
  width:100%;margin-top:12px;padding:15px;border-radius:14px;border:none;background:var(--brand-deep);
  color:#fff;font-weight:700;font-size:15.5px;cursor:pointer;
}
.job-primary.done{background:var(--on);}

/* ---------- rider chat / payment summary ---------- */
.chat-screen,.summary-screen{position:absolute;inset:0;background:var(--paper);z-index:1000;display:none;overflow-y:auto;padding:calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));}
.chat-screen.show,.summary-screen.show{display:block;}
.subpage-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back-btn{width:40px;height:40px;border:1px solid var(--paper-line);background:#fff;border-radius:12px;font-size:20px;cursor:pointer;}
.subpage-title{font-size:18px;font-weight:700;color:#101826;}
.chat-order{font-size:12.5px;color:#6b7686;margin:-8px 0 12px 50px;}
.chat-box{background:#fff;border:1px solid var(--paper-line);border-radius:16px;padding:12px;height:calc(100vh - 210px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.chat-bubble{max-width:82%;padding:9px 11px;border-radius:14px;font-size:13.5px;line-height:1.5;}
.chat-bubble.mine{align-self:flex-end;background:rgba(18,185,129,.14);color:#172033;border-bottom-right-radius:5px;}
.chat-bubble.theirs{align-self:flex-start;background:#f1f5f9;color:#172033;border-bottom-left-radius:5px;}
.chat-time{font-size:10.5px;color:#7b8798;margin-top:3px;}
.chat-compose-rider{display:flex;gap:8px;margin-top:10px;}
.chat-compose-rider input{flex:1;min-width:0;border:1px solid var(--paper-line);background:#fff;border-radius:13px;padding:12px;font-family:inherit;font-size:14px;outline:none;}
.chat-compose-rider button{border:0;border-radius:13px;background:var(--brand-deep);color:#fff;padding:0 17px;font-weight:700;}
.summary-card{background:#fff;border:1px solid var(--paper-line);border-radius:20px;padding:20px;margin-top:12px;}
.summary-ok{text-align:center;font-size:46px;margin-bottom:6px;}
.summary-card h2{text-align:center;margin:0 0 4px;font-size:21px;}
.summary-order{text-align:center;color:#6b7686;font-size:13px;margin-bottom:18px;}
.summary-total{background:#f7f9fc;border-radius:15px;padding:16px;margin:12px 0;}
.summary-total .label{font-size:13px;color:#64748b;}
.summary-total .amount{font-size:30px;font-weight:800;color:#101826;margin-top:3px;}
.summary-cash{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:14px;color:#166534;font-weight:700;}
.summary-note{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:9px;text-align:center;}
.summary-back{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;background:var(--brand-deep);color:#fff;font-family:inherit;font-size:15px;font-weight:700;}
.slide-wrap{position:relative;width:100%;height:52px;margin-top:12px;border-radius:14px;background:#e7ebf2;overflow:hidden;border:1px solid #d8dee8;}
.slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;font-weight:700;pointer-events:none;}
.slide-thumb{position:absolute;left:3px;top:3px;width:46px;height:44px;border-radius:11px;background:var(--brand-deep);color:#fff;border:0;font-size:18px;font-weight:800;cursor:grab;touch-action:none;z-index:2;}
.slide-wrap.done .slide-thumb{background:var(--on);}

.bottomnav{
  position:absolute;left:0;right:0;bottom:0;z-index:600;background:#fff;border-top:1px solid var(--paper-line);
  display:flex;padding:8px 6px calc(8px + var(--safe-bottom));
}
.bottomnav button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:#94a1b3;font-size:11px;font-weight:600;cursor:pointer;
}
.bottomnav button span.ic{font-size:19px;}
.bottomnav button.active{color:var(--brand-deep);}

.panel-screen{
  position:absolute;inset:0;background:var(--paper);z-index:400;overflow-y:auto;
  padding:calc(18px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));display:none;
}
.panel-screen.show{display:block;}
.panel-head{font-size:19px;font-weight:700;margin:6px 0 16px;color:#101826;}
.hist-row{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;color:#374151;display:flex;justify-content:space-between;gap:10px;}
.hist-row b{color:#101826;}
.profile-card{background:#fff;border:1px solid var(--paper-line);border-radius:18px;padding:18px;margin-bottom:14px;}
.profile-card .pname{font-size:18px;font-weight:700;color:#101826;}
.profile-card .prow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--paper-line);font-size:13.5px;color:#4b5563;}
.profile-card .prow:first-of-type{border-top:none;margin-top:10px;}
.btn-logout{width:100%;background:#fff;border:1.5px solid rgba(239,68,68,.4);color:var(--danger);border-radius:14px;padding:14px;font-weight:700;font-size:14.5px;cursor:pointer;}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translate(-50%,14px);
  background:#101826;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:900;
  opacity:0;transition:.25s;max-width:86%;text-align:center;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.emoji-pin{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* =========================================================================
   QueueTech Rider — standalone prototype
   Connects to the same Supabase project as the main QueueTech app.
   Scope on purpose: login, online/offline, see + accept nearby open jobs,
   run one active delivery through its status steps, call/navigate, simple
   job history, profile + logout. Everything else (chat, notifications,
   documents upload, multi-job queue) is left for a later pass.
   ========================================================================= */
const SB = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
const SESSION_KEY = 'qtr_session_v1';
const NEARBY_RADIUS_KM = 2;
const POLL_MS = 7000;

function sbHeaders(token){
  const h = {apikey:SB.KEY, 'Content-Type':'application/json'};
  if(token) h.Authorization = 'Bearer '+token;
  return h;
}
async function sbAuth(path, body){
  const r = await fetch(SB.URL+'/auth/v1/'+path, {method:'POST', headers:sbHeaders(), body:JSON.stringify(body)});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error_description || data.msg || data.message || 'AUTH_ERROR');
  return data;
}
async function sbTable(path, options={}){
  const headers = sbHeaders(options.token);
  if(options.method && options.method!=='GET') headers.Prefer = 'return=representation';
  const r = await fetch(SB.URL+'/rest/v1/'+path, {
    method: options.method||'GET', headers, body: options.body?JSON.stringify(options.body):undefined
  });
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message) || 'DB_ERROR_'+r.status);
  return data;
}
function authEmailFromPhone(phone){ return String(phone||'').replace(/\D/g,'')+'@auth.queuetech.local'; }
function jwtExpiryMs(token){
  try{
    const part = String(token||'').split('.')[1];
    const b64 = part.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((part.length+3)%4);
    return Number(JSON.parse(atob(b64)).exp||0)*1000;
  }catch(e){ return 0; }
}
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
function writeSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function getAccessToken(){
  const s = readSession(); if(!s) return '';
  const exp = Number(s.expiresAt||0) || jwtExpiryMs(s.accessToken);
  if(exp - Date.now() > 60000) return s.accessToken;
  if(!s.refreshToken) return s.accessToken;
  try{
    const r = await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:sbHeaders(), body:JSON.stringify({refresh_token:s.refreshToken})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !data.access_token) return s.accessToken;
    const next = {...s, accessToken:data.access_token, refreshToken:data.refresh_token||s.refreshToken, expiresAt:(data.expires_at?data.expires_at*1000:0)};
    writeSession(next);
    return next.accessToken;
  }catch(e){ return s.accessToken; }
}
function esc(v){ return String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function haversineKm(lat1,lon1,lat2,lon2){
  if([lat1,lon1,lat2,lon2].some(v=>!Number.isFinite(Number(v)))) return Infinity;
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mapsLink(lat,lng,address){
  if(Number.isFinite(Number(lat)) && Number.isFinite(Number(lng))) return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng);
  return address ? 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address) : 'https://www.google.com/maps/';
}

/* order status <-> db column + note tag, matching the main QueueTech app */
function statusToDb(s){
  return {ready:'ready', assigned:'assigned', picked_up:'picked_up', delivering:'in_progress', arrived:'in_progress', completed:'completed'}[s] || s;
}
function statusFromRow(row){
  const m = (row.note||'').match(/__QT_ORDER_STATUS__=([^\n]+)/);
  if(m) return m[1];
  return {ready:'ready', assigned:'assigned', picked_up:'picked_up', in_progress:'delivering', completed:'completed'}[row.status] || row.status;
}
function noteWithTag(row, tag){
  const body = (row.note||'').replace(/__QT_ORDER_STATUS__=[^\n]+\n?/,'');
  return ('__QT_ORDER_STATUS__='+tag+'\n'+body).trim();
}
const STEP_LABEL = {
  assigned:'ไปรับสินค้าที่ร้าน', picked_up:'รับสินค้าแล้ว — ไปส่งลูกค้า',
  delivering:'กำลังจัดส่ง', arrived:'ถึงลูกค้าแล้ว', completed:'ส่งสำเร็จ'
};
const STEP_NEXT = { assigned:{to:'picked_up', label:'ถึงร้านแล้ว / รับสินค้า'},
  picked_up:{to:'delivering', label:'เริ่มจัดส่ง'},
  delivering:{to:'arrived', label:'ถึงลูกค้าแล้ว'},
  arrived:{to:'completed', label:'ยืนยันส่งสำเร็จ'} };

/* ---------- app state ---------- */
const S = {
  session:null, user:null, riderProfile:null,
  online:false, pos:null, map:null, riderMarker:null, jobMarkers:[],
  activeOrder:null, openJobs:[], history:[], activeTab:'home', pollTimer:null, chatOrder:null, chatTimer:null
};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ---------- boot ---------- */
function boot(){
  const s = readSession();
  if(s){ S.session = s; resumeSession(); }
  else renderLogin();
}
async function resumeSession(){
  try{
    const token = await getAccessToken();
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(S.session.authUserId), {token});
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ clearSession(); renderLogin('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); return; }
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    await loadRiderProfile();
    renderStage();
  }catch(e){ console.error(e); clearSession(); renderLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
}
async function loadRiderProfile(){
  const token = await getAccessToken();
  const rows = await sbTable('rider_profiles?select=*&user_id=eq.'+encodeURIComponent(S.user.id), {token});
  S.riderProfile = Array.isArray(rows) && rows[0] ? rows[0] : null;
  S.online = !!(S.riderProfile && S.riderProfile.metadata && S.riderProfile.metadata.online);
}

/* ---------- LOGIN ---------- */
function renderLogin(err){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="screen-center">
      <div class="auth-card">
        <div class="auth-mark"><span class="dot"></span><b>QUEUETECH RIDER</b></div>
        <h1>เข้าสู่ระบบไรเดอร์</h1>
        <p class="sub">ใช้เบอร์โทรและรหัสผ่านบัญชีไรเดอร์ของคุณใน QueueTech</p>
        <div class="field"><label>เบอร์โทรศัพท์</label><input id="li-phone" inputmode="tel" placeholder="08xxxxxxxx"></div>
        <div class="field"><label>รหัสผ่าน</label><input id="li-pass" type="password" placeholder="รหัสผ่าน"></div>
        <button class="btn btn-brand" id="li-btn">เข้าสู่ระบบ</button>
        <div class="auth-err" id="li-err"></div>
        
      </div>
    </div>`));
  const errBox = document.getElementById('li-err');
  if(err){ errBox.textContent = err; errBox.classList.add('show'); }
  document.getElementById('li-btn').onclick = doLogin;
  document.getElementById('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const btn = document.getElementById('li-btn');
  const errBox = document.getElementById('li-err');
  const phone = document.getElementById('li-phone').value.trim();
  const pass = document.getElementById('li-pass').value;
  errBox.classList.remove('show');
  if(!phone || !pass){ errBox.textContent='กรุณากรอกเบอร์โทรและรหัสผ่าน'; errBox.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const email = phone.includes('@') ? phone : authEmailFromPhone(phone);
    const auth = await sbAuth('token?grant_type=password', {email, password:pass});
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(auth.user.id), {token:auth.access_token});
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ throw new Error('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); }
    S.session = {authUserId:auth.user.id, accessToken:auth.access_token, refreshToken:auth.refresh_token||null, expiresAt:auth.expires_at?auth.expires_at*1000:0};
    writeSession(S.session);
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    await loadRiderProfile();
    renderStage();
  }catch(e){
    console.error(e);
    errBox.textContent = /invalid/i.test(e.message) ? 'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง' : e.message;
    errBox.classList.add('show');
  }finally{ btn.disabled=false; btn.textContent='เข้าสู่ระบบ'; }
}

function switchTab(tab){
  S.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('panel-jobs').classList.toggle('show', tab==='jobs');
  document.getElementById('panel-profile').classList.toggle('show', tab==='profile');
  document.getElementById('sheet').style.display = tab==='home' ? '' : 'none';
  document.getElementById('map').style.display = tab==='home' ? '' : 'none';
  document.querySelectorAll('.fab-stack .fab').forEach(f=>f.style.display = tab==='home' ? '' : 'none');
  if(tab==='jobs') renderHistoryPanel();
  if(tab==='profile') renderProfilePanel();
}

function initMap(){
  S.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([13.7563,100.5018], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(S.map);
}
function startGeolocation(){
  if(!navigator.geolocation){ toast('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
  S.watchId = navigator.geolocation.watchPosition(pos=>{
    S.pos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    placeRiderMarker();
    if(!S._centeredOnce){ S.map.setView([S.pos.lat,S.pos.lng], 15); S._centeredOnce = true; }
    if(S.online) pushLocation();
    if(S.activeTab==='home') renderSheet();
  }, ()=>toast('ไม่สามารถขอตำแหน่ง GPS ได้'), {enableHighAccuracy:true, maximumAge:5000, timeout:12000});
}
function placeRiderMarker(){
  if(!S.pos) return;
  const icon = L.divIcon({html:'<div class="emoji-pin">🛵</div>', className:'', iconSize:[30,30], iconAnchor:[15,15]});
  if(S.riderMarker) S.riderMarker.setLatLng([S.pos.lat,S.pos.lng]);
  else S.riderMarker = L.marker([S.pos.lat,S.pos.lng], {icon}).addTo(S.map);
}
function recenterMap(){
  if(!S.pos){ toast('ยังไม่ได้ตำแหน่ง GPS'); return; }
  S.map.setView([S.pos.lat,S.pos.lng], 15);
}

/* ---------- online toggle ---------- */
async function toggleOnline(){
  const next = !S.online;
  S.online = next;
  updateStatusUI();
  try{
    const token = await getAccessToken();
    const meta = Object.assign({}, (S.riderProfile&&S.riderProfile.metadata)||{}, {online:next});
    const body = {user_id:S.user.id, rider_name:S.user.name||'ไรเดอร์', phone:S.user.phone||null,
      vehicle_type:(S.riderProfile&&S.riderProfile.vehicle_type)||null, vehicle_plate:(S.riderProfile&&S.riderProfile.vehicle_plate)||null,
      latitude:S.pos?S.pos.lat:null, longitude:S.pos?S.pos.lng:null, status:'active', metadata:meta};
    let rows;
    if(S.riderProfile && S.riderProfile.user_id){
      rows = await sbTable('rider_profiles?user_id=eq.'+encodeURIComponent(S.user.id), {method:'PATCH', token, body});
    }else{
      rows = await sbTable('rider_profiles', {method:'POST', token, body});
    }
    S.riderProfile = Array.isArray(rows)?rows[0]:rows;
    toast(next ? '🟢 เปิดรับงานแล้ว' : '⚪ ปิดรับงานแล้ว');
    refreshData();
  }catch(e){
    console.error(e); S.online = !next; updateStatusUI();
    toast('เปลี่ยนสถานะไม่สำเร็จ: '+e.message);
  }
}
async function pushLocation(){
  if(!S.pos || !S.riderProfile) return;
  try{
    const token = await getAccessToken();
    await sbTable('rider_profiles?user_id=eq.'+encodeURIComponent(S.user.id), {method:'PATCH', token, body:{latitude:S.pos.lat, longitude:S.pos.lng}});
  }catch(e){ /* best-effort */ }
}
function updateStatusUI(){
  const pill = document.getElementById('status-pill');
  const sw = document.getElementById('status-switch');
  const label = document.getElementById('status-text');
  if(!pill) return;
  pill.classList.toggle('on', S.online);
  sw.classList.toggle('on', S.online);
  label.textContent = S.online ? 'ออนไลน์' : 'ออฟไลน์';
}

/* ---------- data refresh ---------- */
async function refreshData(){
  try{
    const token = await getAccessToken();
    const mine = await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(S.riderProfile.id)+'&status=in.(assigned,picked_up,in_progress)&order=created_at.desc&limit=1', {token});
    S.activeOrder = Array.isArray(mine) && mine[0] ? mine[0] : null;

    if(S.activeOrder){
      await enrichOrder(S.activeOrder);
      S.openJobs = [];
    } else if(S.online){
      const open = await sbTable('orders?select=*&order_type=eq.shopping&status=eq.ready&rider_id=is.null&order=created_at.asc&limit=25', {token});
      const list = Array.isArray(open) ? open : [];
      for(const o of list) await enrichOrder(o);
      const candidates = list
        .map(o=>({order:o, distanceKm: haversineKm(S.pos&&S.pos.lat, S.pos&&S.pos.lng, o.pickup_latitude, o.pickup_longitude)}))
        .filter(x=>Number.isFinite(x.distanceKm))
        .sort((a,b)=>a.distanceKm-b.distanceKm);
      const nearby = candidates.filter(x=>x.distanceKm <= NEARBY_RADIUS_KM);
      // Rider-side fallback: if there is no job within 2 km, keep the nearest open job visible.
      // Final nearest-Rider assignment must be enforced server-side/RPC to prevent two riders claiming the same fallback job.
      S.openJobs = nearby.length ? nearby : (candidates.length ? [{...candidates[0], fallback:true}] : []);
    } else {
      S.openJobs = [];
    }
    if(S.activeTab==='home') renderSheet();
    placeJobMarkers();

    const hist = await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(S.riderProfile.id)+'&status=eq.completed&order=updated_at.desc&limit=30', {token});
    S.history = Array.isArray(hist) ? hist : [];
    if(S.activeTab==='jobs') renderHistoryPanel();
  }catch(e){ console.error('refreshData failed', e); }
}
async function enrichOrder(o){
  const token = await getAccessToken();
  if(o.shop_id && !o._shop){
    try{ const rows = await sbTable('shop_profiles?select=shop_name,phone,address&id=eq.'+encodeURIComponent(o.shop_id), {token}); o._shop = Array.isArray(rows)&&rows[0] ? rows[0] : null; }
    catch(e){ o._shop = null; }
  }
  if(o.customer_id && !o._customer){
    try{ const rows = await sbTable('users?select=name,phone&id=eq.'+encodeURIComponent(o.customer_id), {token}); o._customer = Array.isArray(rows)&&rows[0] ? rows[0] : null; }
    catch(e){ o._customer = null; }
  }
}
function placeJobMarkers(){
  S.jobMarkers.forEach(m=>S.map.removeLayer(m)); S.jobMarkers = [];
  const list = S.activeOrder ? [S.activeOrder] : S.openJobs.map(x=>x.order);
  const bounds = [];
  list.forEach(o=>{
    const plat=Number(o.pickup_latitude), plng=Number(o.pickup_longitude);
    const dlat=Number(o.delivery_latitude), dlng=Number(o.delivery_longitude);
    if(Number.isFinite(plat)&&Number.isFinite(plng)){
      const m=L.marker([plat,plng],{icon:L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#16a34a;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(S.map);
      m.bindPopup('<b style="color:#15803d">จุดรับ</b><br>'+esc(o.pickup_address||'ร้านค้า'));
      S.jobMarkers.push(m); bounds.push([plat,plng]);
    }
    if(Number.isFinite(dlat)&&Number.isFinite(dlng)){
      const m=L.marker([dlat,dlng],{icon:L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(S.map);
      m.bindPopup('<b style="color:#b91c1c">จุดส่ง</b><br>'+esc(o.delivery_address||'บ้านลูกค้า'));
      S.jobMarkers.push(m); bounds.push([dlat,dlng]);
    }
  });
  if(bounds.length && S.activeTab==='home' && !S.pos){
    try{ S.map.fitBounds(bounds,{padding:[45,45],maxZoom:16}); }catch(e){}
  }
}

        <a class="nav-btn" href="${esc(mapsLink(navLat,navLng,navAddr))}" target="_blank" rel="noopener">🧭 นำทาง</a>
      </div>
      ${next && next.to==='completed' ? slideConfirmHTML() : (next ? `<button class="job-primary" id="advance-btn">${esc(next.label)}</button>` : '')}
    </div>`;
}

function slideConfirmHTML(){
  return `<div class="slide-wrap" id="delivery-slide" aria-label="เลื่อนเพื่อยืนยันส่งสำเร็จ">
    <div class="slide-label">เลื่อนเพื่อยืนยันส่งสำเร็จ</div>
    <button class="slide-thumb" id="delivery-slide-thumb" type="button">›</button>
  </div>`;
}

function bindJobCardEvents(o){
  const btn = document.getElementById('advance-btn');
  if(btn) btn.onclick = ()=>advanceOrder(o);
  const chatBtn = document.getElementById('chat-btn');
  if(chatBtn) chatBtn.onclick = ()=>openChat(o);
  const slide = document.getElementById('delivery-slide');
  const thumb = document.getElementById('delivery-slide-thumb');
  if(slide && thumb) bindDeliverySlide(slide,thumb,()=>completeAndShowSummary(o));
}

function bindDeliverySlide(track,thumb,onDone){
  let startX=0,current=0,drag=false,finished=false;
  const max=()=>Math.max(0,track.clientWidth-thumb.offsetWidth-6);
  const move=x=>{ current=Math.max(0,Math.min(max(),x-startX)); thumb.style.transform=`translateX(${current}px)`; };
  const end=()=>{ if(!drag||finished)return; drag=false; if(current>=max()*0.82){ finished=true; current=max(); thumb.style.transform=`translateX(${current}px)`; track.classList.add('done'); thumb.textContent='✓'; onDone(); } else { current=0; thumb.style.transform='translateX(0)'; } };
  thumb.addEventListener('pointerdown',e=>{ if(finished)return; drag=true; startX=e.clientX-current; thumb.setPointerCapture?.(e.pointerId); });
  thumb.addEventListener('pointermove',e=>{ if(drag)move(e.clientX); });
  thumb.addEventListener('pointerup',end);
  thumb.addEventListener('pointercancel',end);
}

async function completeAndShowSummary(o){
  try{
    const token=await getAccessToken();
    const updated=await sbTable('orders?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',token,body:{status:'completed',note:noteWithTag(o,'completed'),updated_at:new Date().toISOString()}});
    let finalOrder=Array.isArray(updated)&&updated[0]?updated[0]:null;
    if(!finalOrder){
      const rows=await sbTable('orders?id=eq.'+encodeURIComponent(o.id)+'&select=*',{token});
      finalOrder=Array.isArray(rows)?rows[0]:null;
    }
    if(!finalOrder) finalOrder=o;
    stopPolling();
    renderPaymentSummary(finalOrder);
  }catch(e){ console.error(e); toast('ยืนยันส่งสำเร็จไม่สำเร็จ: '+e.message); }
}

function renderPaymentSummary(o){
  const stage=document.querySelector('.stage');
  if(stage) stage.style.display='none';
  let screen=document.getElementById('summary-screen');
  if(!screen){ screen=document.createElement('div'); screen.id='summary-screen'; screen.className='summary-screen'; document.getElementById('app').appendChild(screen); }
  const amount=Number(o.total_amount||0);
  screen.innerHTML=`<div class="subpage-head"><button class="back-btn" id="summary-back">‹</button><div class="subpage-title">สรุปการส่งออเดอร์</div></div>
    <div class="summary-card">
      <div class="summary-ok">✓</div>
      <h2>ส่งออเดอร์สำเร็จ</h2>
      <div class="summary-order">ออเดอร์ ${esc(o.order_number||o.id.slice(0,8))}</div>
      <div class="summary-total"><div class="label">ราคาที่ลูกค้าต้องชำระ</div><div class="amount">฿${amount.toLocaleString('th-TH')}</div></div>
      <div class="summary-cash">💵 <span>เก็บเงินสดจากลูกค้า</span></div>
      <div class="summary-note">ยอดนี้คือจำนวนเงินที่ลูกค้าต้องชำระให้ไรเดอร์เมื่อรับสินค้า</div>
      <button class="summary-back" id="summary-home">กลับหน้าหลัก Rider</button>
    </div>`;
  screen.classList.add('show');
  const back=()=>{ screen.classList.remove('show'); if(stage){stage.style.display='block';} S.activeOrder=null; refreshData(); startPolling(); };
  document.getElementById('summary-back').onclick=back;
  document.getElementById('summary-home').onclick=back;
}

function closeChat(){
  if(S.chatTimer) clearInterval(S.chatTimer); S.chatTimer=null; S.chatOrder=null;
  const screen=document.getElementById('chat-screen'); if(screen) screen.classList.remove('show');
  const stage=document.querySelector('.stage'); if(stage) stage.style.display='block';
  renderSheet();
}

async function loadChatMessages(orderId){
  try{
    const token=await getAccessToken();
    const rows=await sbTable('order_chat_messages?select=*&order_id=eq.'+encodeURIComponent(orderId)+'&order=created_at.asc',{token});
    return Array.isArray(rows)?rows:[];
  }catch(e){ console.error('chat load failed',e); return []; }
}

function renderChatMessages(rows){
  const box=document.getElementById('chat-box'); if(!box)return;
  box.innerHTML=rows.length?rows.map(m=>`<div class="chat-bubble ${String(m.sender_id)===String(S.user.id)?'mine':'theirs'}"><div>${esc(m.message||'')}</div><div class="chat-time">${new Date(m.created_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty-note">ยังไม่มีข้อความ เริ่มแชทกับลูกค้าได้เลย</div>';
  box.scrollTop=box.scrollHeight;
}

async function openChat(o){
  S.chatOrder=o;
  const stage=document.querySelector('.stage'); if(stage) stage.style.display='none';
  let screen=document.getElementById('chat-screen');
  if(!screen){ screen=document.createElement('div'); screen.id='chat-screen'; screen.className='chat-screen'; document.getElementById('app').appendChild(screen); }
  const cust=o._customer||{};
  screen.innerHTML=`<div class="subpage-head"><button class="back-btn" id="chat-back">‹</button><div class="subpage-title">แชทกับลูกค้า</div></div>
    <div class="chat-order">ออเดอร์ ${esc(o.order_number||o.id.slice(0,8))} • ${esc(cust.name||'ลูกค้า')}</div>
    <div class="chat-box" id="chat-box"><div class="empty-note">กำลังโหลดข้อความ...</div></div>
    <form class="chat-compose-rider" id="chat-form"><input id="chat-input" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความถึงลูกค้า..." required><button type="submit">ส่ง</button></form>`;
  screen.classList.add('show');
  document.getElementById('chat-back').onclick=closeChat;
  document.getElementById('chat-form').onsubmit=async e=>{e.preventDefault(); await sendRiderChat(o);};
  renderChatMessages(await loadChatMessages(o.id));
  if(S.chatTimer)clearInterval(S.chatTimer);
  S.chatTimer=setInterval(async()=>{if(S.chatOrder?.id===o.id)renderChatMessages(await loadChatMessages(o.id));},4000);
}

async function sendRiderChat(o){
  const input=document.getElementById('chat-input'); const message=(input?.value||'').trim(); if(!message)return;
  try{
    const token=await getAccessToken();
    await sbTable('order_chat_messages',{method:'POST',token,body:{order_id:o.id,sender_id:S.user.id,message}});
    input.value=''; renderChatMessages(await loadChatMessages(o.id));
  }catch(e){ console.error(e); toast('ส่งข้อความไม่สำเร็จ: '+e.message); }
}

async function acceptJob(orderId){
  const btn=document.getElementById('accept-'+orderId);
  if(btn){ btn.disabled=true; btn.textContent='กำลังรับงาน...'; }
  try{
    const token = await getAccessToken();
    if(!token) throw new Error('ไม่พบเซสชันเข้าสู่ระบบ');
    if(!S.riderProfile || !S.riderProfile.id) throw new Error('ไม่พบ rider_profiles.id ของไรเดอร์');
    const currentRows = await sbTable('orders?id=eq.'+encodeURIComponent(orderId), {token});
    const current = Array.isArray(currentRows) ? currentRows[0] : null;
    if(!current){ throw new Error('ไม่พบออเดอร์ในฐานข้อมูล'); }
    if(current.rider_id){ toast('งานนี้มีไรเดอร์รับไปแล้ว'); refreshData(); return; }
    const updated = await sbTable('orders?id=eq.'+encodeURIComponent(orderId)+'&rider_id=is.null', {method:'PATCH', token, body:{
      rider_id:S.riderProfile.id, status:statusToDb('assigned'), note:noteWithTag(current,'assigned'), updated_at:new Date().toISOString()
    }});
    if(!Array.isArray(updated) || !updated.length){
      const verify=await sbTable('orders?id=eq.'+encodeURIComponent(orderId)+'&select=id,rider_id,status,order_number', {token});
      const row=Array.isArray(verify)?verify[0]:null;
      if(!row || row.rider_id!==S.riderProfile.id) throw new Error('เซิร์ฟเวอร์ไม่ยืนยันการรับงาน');
    }
    toast('รับงานสำเร็จ 🎉');
    await refreshData();
  }catch(e){
    console.error('acceptJob failed',e);
    toast('รับงานไม่สำเร็จ: '+String(e.message||e));
    if(btn){ btn.disabled=false; btn.textContent='รับงานนี้'; }
  }
}

async function advanceOrder(o){
  const status = statusFromRow(o);
  const next = STEP_NEXT[status];
  if(!next) return;
  try{
    const token = await getAccessToken();
    await sbTable('orders?id=eq.'+encodeURIComponent(o.id), {method:'PATCH', token, body:{
      status:statusToDb(next.to), note:noteWithTag(o,next.to), updated_at:new Date().toISOString()
    }});
    toast(next.to==='completed' ? 'ส่งสำเร็จ! 🎉' : 'อัปเดตสถานะแล้ว');
    refreshData();
  }catch(e){ console.error(e); toast('อัปเดตสถานะไม่สำเร็จ: '+e.message); }
}

/* ---------- polling ---------- */
function startPolling(){ stopPolling(); S.pollTimer = setInterval(refreshData, POLL_MS); }
function stopPolling(){ if(S.pollTimer) clearInterval(S.pollTimer); S.pollTimer=null; }

boot();

/* ===== QueueTech Rider: direct Supabase open-job alert ===== */
(function(){
  let timer=null, alertJobId=null, audioCtx=null;

  function ctx(){
    try{
      if(!audioCtx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return null;
        audioCtx=new AC();
      }
      return audioCtx;
    }catch(e){ return null; }
  }

  function unlock(){
    try{
      const c=ctx();
      if(c && c.state==='suspended') c.resume().catch(()=>{});
    }catch(e){}
  }

  function beep(){
    try{
      const c=ctx();
      if(!c) return;
      if(c.state==='suspended') c.resume().catch(()=>{});
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.value=880;
      g.gain.setValueAtTime(.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.03);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+.46);
    }catch(e){}
  }

  function vibrate(){
    try{
      if(navigator.vibrate) navigator.vibrate([500,180,500,180,800]);
    }catch(e){}
  }

  function ensureUI(){
    let el=document.getElementById('qt-rider-alert');
    if(el) return el;
    el=document.createElement('div');
    el.id='qt-rider-alert';
    el.setAttribute('role','alert');
    el.style.cssText=
      'position:fixed;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top));'+
      'z-index:9999;display:none;background:#111827;color:#fff;border-radius:18px;'+
      'padding:14px 16px;box-shadow:0 10px 35px rgba(0,0,0,.28);'+
      'font-family:inherit;text-align:center;';
    el.innerHTML='<div style="font-size:16px;font-weight:800">มีงานใหม่สำหรับคุณ</div>'+
      '<div id="qt-rider-alert-detail" style="font-size:13px;margin-top:4px;opacity:.88">'+
      'กรุณากดรับงาน</div>';
    document.body.appendChild(el);
    return el;
  }

  function stop(hide){
    if(timer){ clearInterval(timer); timer=null; }
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
    if(hide!==false){
      const el=document.getElementById('qt-rider-alert');
      if(el) el.style.display='none';
    }
    alertJobId=null;
    window.qtRiderAlertState={active:false,jobId:null};
  }

  function start(job){
    if(!job || !job.id) return;
    const id=String(job.id);
    if(alertJobId===id && timer) return;

    stop(false);
    alertJobId=id;

    const el=ensureUI();
    const d=document.getElementById('qt-rider-alert-detail');
    if(d){
      d.textContent='งาน '+(job.order_number||id.slice(0,8))+
        ' • กดรับงานเพื่อหยุดเสียงและสั่น';
    }
    el.style.display='block';

    unlock(); beep(); vibrate();
    timer=setInterval(function(){ beep(); vibrate(); },2500);
    window.qtRiderAlertState={active:true,jobId:id};
  }

  ['click','touchstart','pointerdown'].forEach(function(ev){
    document.addEventListener(ev,unlock,{passive:true});
  });

  /*
   * Direct binding:
   * refreshData() fills S.openJobs from the Supabase orders query.
   * Compare the actual order IDs before/after refresh.
   */
  const originalRefreshData=window.refreshData;
  if(typeof originalRefreshData==='function'){
    window.refreshData=async function(){
      const before=Array.isArray(window.S && S.openJobs)
        ? S.openJobs.map(function(x){return x&&x.order?x.order:x;}).filter(Boolean)
        : [];
      const beforeIds=new Set(
        before.map(function(o){return o&&o.id?String(o.id):null;}).filter(Boolean)
      );

      const result=await originalRefreshData.apply(this,arguments);

      const jobs=Array.isArray(window.S && S.openJobs)
        ? S.openJobs.map(function(x){return x&&x.order?x.order:x;}).filter(Boolean)
        : [];

      if(alertJobId && !jobs.some(function(o){
        return o && String(o.id)===String(alertJobId);
      })){
        stop(true);
      }

      const fresh=jobs.find(function(o){
        return o && o.id && !beforeIds.has(String(o.id));
      });
      if(fresh) start(fresh);

      return result;
    };
  }

  const originalAcceptJob=window.acceptJob;
  if(typeof originalAcceptJob==='function'){
    window.acceptJob=async function(){
      stop(true);
      return await originalAcceptJob.apply(this,arguments);
    };
  }

  window.qtStartNewJobAlert=start;
  window.qtStopNewJobAlert=function(){stop(true);};
})();

</script>
